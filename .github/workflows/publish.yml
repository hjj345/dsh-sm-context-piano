name: Publish npm package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p \"require('./package.json').version\")"

      - name: Build and test
        run: pnpm verify

      - name: Assemble npm package
        shell: bash
        run: |
          cp package.json README.md README.en.md LICENSE cordis.patch.yml Relese-command/npm/
          cp lib/index.js lib/client.js Relese-command/npm/lib/

      - name: Publish to npm with OIDC
        working-directory: Relese-command/npm
        run: npm publish --access public --provenance
